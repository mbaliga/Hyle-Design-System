name: Apple tokens

# Builds the Swift token package (apple/HyleTokens) UNSIGNED on a hosted macOS runner.
# Runs only while the repo is public (macOS minutes are free then; OQ-20). No artifacts
# are uploaded (R6) and no signing secrets exist anywhere in this workflow.
on:
  push:
    branches: [main]
    paths:
      - "tokens/**"
      - "scripts/build-tokens.js"
      - "apple/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/ios.yml"
  pull_request:
    paths:
      - "tokens/**"
      - "scripts/build-tokens.js"
      - "apple/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/ios.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  swift-tokens:
    if: github.event.repository.private == false
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      # TODO: pin these actions to full commit SHAs (tags only until the owner reviews).
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
      - run: npm ci
      - name: Regenerate tokens and check apple/ has not drifted
        run: |
          npm run tokens:build
          git diff --exit-code apple/
      - name: swift build (macOS, AppKit branch)
        working-directory: apple/HyleTokens
        run: swift build
      - name: swift test (macOS, AppKit branch)
        working-directory: apple/HyleTokens
        run: swift test
      # Compile-only for the UIKit branch (iPhone and iPad share it). Unsigned. The scheme
      # name HyleTokens-Package is SwiftPM's usual one but has not been run yet.
      - name: Compile for iOS Simulator (unsigned)
        working-directory: apple/HyleTokens
        run: >
          xcodebuild build-for-testing
          -scheme HyleTokens-Package
          -destination 'generic/platform=iOS Simulator'
          CODE_SIGNING_ALLOWED=NO

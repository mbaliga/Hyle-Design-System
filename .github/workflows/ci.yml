name: CI

# Hyle is pure-data + Compose tokens — JVM-testable, no native build. Public repo,
# so GitHub Actions minutes are free.
on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          # v3 AND v4 default to installing the legacy 'tools' package, which
          # Google's repo no longer serves (sdkmanager exit 1 at SDK setup,
          # 2026-09-15 - see core CLAUDE.md's CI caveat, third infra class).
          packages: platform-tools
      - name: Install platform + build-tools
        run: |
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - name: Token tests (:hyle:test)
        run: ./gradlew --no-daemon :hyle:test
      # :crash-recovery is a tombstone (see crash-recovery/MOVED.md) -- no implementation and
      # no tests remain. It must still ASSEMBLE, because consumers composite this build and a
      # broken module here would fail their configuration even if they never use it.
      - name: Crash-recovery tombstone assembles (:crash-recovery:assembleRelease)
        run: ./gradlew --no-daemon :crash-recovery:assembleRelease
      - name: Build the live wallpaper (:wallpaper)
        run: ./gradlew --no-daemon :wallpaper:assembleDebug
